name: DNGA v6.0 R2 integration (offline)

on:
  push:
    branches:
      - v6.0
  pull_request:
    branches:
      - v6.0
  workflow_dispatch:

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile DNGA controller
        run: |
          python -m py_compile selfdrive/car/dnga/carcontroller.py
          python -m py_compile selfdrive/car/dnga/longitudinal.py
          python -m py_compile selfdrive/car/dnga/longitudinal_v50_legacy.py
          python -m py_compile selfdrive/car/dnga/longitudinal_atomic_release.py
          python -m py_compile selfdrive/car/dnga/longitudinal_op_only.py
          python -m py_compile selfdrive/car/dnga/longitudinal_kinematic_guard.py
          python -m py_compile selfdrive/car/dnga/carstate.py
          python -m py_compile selfdrive/car/dnga/dngacan.py
          python -m py_compile selfdrive/car/dnga/interface.py
      - name: Integrated v6 R2 command tests (fake messaging/feedback, no ECU)
        run: |
          python selfdrive/car/dnga/tests/test_v60_integrated_r2.py -v
