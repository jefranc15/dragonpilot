name: Apply DNGA V4.0

on:
  push:
    branches:
      - nightly
    paths:
      - tools/dnga/apply_dnga_v4_0.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply DNGA V4.0 patch
        run: python tools/dnga/apply_dnga_v4_0.py
      - name: Validate and commit V4.0
        shell: bash
        run: |
          git diff --check
          python -m py_compile selfdrive/car/dnga/carcontroller.py selfdrive/car/dnga/carstate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfdrive/car/dnga/carcontroller.py selfdrive/car/dnga/carstate.py
          if git diff --cached --quiet; then
            echo "No V4.0 changes to commit"
            exit 0
          fi
          git commit -m "DNGA V4.0: fix engagement and hybrid fault isolation"
          git push origin HEAD:nightly
