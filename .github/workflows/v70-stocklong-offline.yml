name: DNGA V7.0 stock longitudinal prototype (offline only)

on:
  push:
    branches: [V7.0-stocklong]
  pull_request:
    branches: [V7.0-stocklong]
  workflow_dispatch:

jobs:
  shadow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile affected controller and camera observation modules
        run: |
          python -m py_compile selfdrive/car/dnga/carcontroller.py
          python -m py_compile selfdrive/car/dnga/interface.py
          python -m py_compile selfdrive/car/dnga/carstate.py
          python -m py_compile selfdrive/car/dnga/stock_long_shadow.py
          python -m py_compile selfdrive/car/dnga/tests/test_v70_stocklong_shadow.py
      - name: Read-only stocklong single-owner and shadow tests
        run: |
          python selfdrive/car/dnga/tests/test_v70_stocklong_shadow.py -v
      - name: Preserve previous offline evidence analyzer tests
        run: |
          python selfdrive/car/dnga/tests/test_v60_offline_turn_lead_review.py -v
          python selfdrive/car/dnga/tests/test_v60_highway_handoff_audit.py -v
